# =============================================================================
# CUID — ordem 4 em MICRO_SERVICES (proxy_conf.yaml)
# =============================================================================
# Função:     obtém o identificador único (CUID) do usuário no serviço cuidapp
#             a partir de iuid_attribute e grava o resultado em cuid_attribute.
# Depende de: serviço cuidapp.
# Segredos:   CUID_ACCESS_TOKEN (.env).
# -----------------------------------------------------------------------------
module: coreaai_proxy_plugins.satosa.micro_services.cuid.CUIDClient
name: CUID
config:
  default:
    default:
      access_token: "$CUID_ACCESS_TOKEN"
      api_endpoint: "http://cuidapp:8080/cuid/"
      api_req_timeout: 5
      iuid_attribute: mail
      cuid_attribute: cuid
      scope: core.aai.geant.org
      disabled: false
