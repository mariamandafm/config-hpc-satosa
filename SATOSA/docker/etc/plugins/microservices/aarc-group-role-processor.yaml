# =============================================================================
# AarcGroupRoleProcessor — ordem 7 em MICRO_SERVICES (proxy_conf.yaml)
# =============================================================================
# Função:     converte grupos/papéis em entitlements no formato URN AARC-G069.
# Usado por:  access-per-vo (lê o atributo "entitlements").
# Segredos:   nenhum. Serviço externo: nenhum.
#
# Atenção:    urn_namespace, from_group_role_attribute e to_group_role_attribute
#             são decisão de política (namespace da federação). Os valores
#             abaixo são exemplo, não uma decisão tomada.
# -----------------------------------------------------------------------------
module: coreaai_proxy_plugins.satosa.micro_services.aarc_group_role_processor.AarcGroupRoleProcessor
name: AarcGroupRoleProcessor
config:
  default:
    default:
      urn_namespace: "urn:geant:core-aai.local"
      from_group_role_attribute: "groups"
      to_group_role_attribute: "entitlements"
      clear_from_group_role_attribute: false
