# =============================================================================
# CreateAccount — ordem 5 em MICRO_SERVICES (proxy_conf.yaml)
# =============================================================================
# Função:     cria a conta do usuário no Perun (via RPC API) e o registra no
#             VO de contas.
# Depende de: API do Perun.
# Segredos:   PERUN_API_USER, PERUN_API_PASSWORD (.env).
#             PERUN_API_URL e PERUN_VO_ID também vêm do .env.
# -----------------------------------------------------------------------------
module: coreaai_proxy_plugins.satosa.micro_services.accounts.CreateAccount
name: CreateAccount
config:
  - lookup_strategy: rpc_api

    # --- VO de registro ------------------------------------------------------
    # VO "Account Registry" (Perun id 3, via PERUN_VO_ID no .env): só registro
    # de contas — não dá acesso a nenhum SP; nenhum requisito do access-per-vo
    # usa ele.
    vo_id: $PERUN_VO_ID
    vo_name: "registry"
    cuid_external_provision: true

    # --- Atributos internos do SATOSA ----------------------------------------
    # Nomes conforme internal_attributes.yaml (givenname/surname/mail).
    attr_internal_groups: "groups"
    attr_internal_first_name: "givenname"
    attr_internal_last_name: "surname"
    attr_internal_email: "mail"
    attr_internal_epsa: "eduPersonScopedAffiliation"
    attr_internal_iuids: "cuid"
    attr_internal_cuid_preset: "cuid"
    attr_internal_cuid: "cuid"

    # --- Atributos correspondentes no Perun ----------------------------------
    attr_perun_ues_iuids: "urn:perun:ues:attribute-def:def:iuids"
    attr_perun_ues_epsa: "urn:perun:ues:attribute-def:def:affiliation"
    attr_perun_user_pref_email: "urn:perun:user:attribute-def:def:preferredMail"
    attr_perun_user_cuid: "urn:perun:user:attribute-def:def:login-namespace:geant-core-aai-persistent-shadow"

    # --- Ativação de usuário (desligada) -------------------------------------
    enable_extensions_activate_user: false
    attr_perun_activate_user: "urn:perun:user:attribute-def:def:userActive:geant-core-aai"
    activate_user_value: "ActivatedUser"

    # --- Conexão com a API do Perun ------------------------------------------
    api_base_url: "$PERUN_API_URL"
    api_auth_user: "$PERUN_API_USER"
    api_auth_password: "$PERUN_API_PASSWORD"
    api_timeout: 30

    error_url: "https://localhost:8000/error?reason=account_creation_failed"
