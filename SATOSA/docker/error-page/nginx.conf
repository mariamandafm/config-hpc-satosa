# Qualquer caminho (ex.: /error/vo_access_denied/<base64>) serve a mesma
# index.html; o JavaScript da página interpreta o caminho e a query string.
server {
    listen 80;
    root /usr/share/nginx/html;

    # O base64 do access_per_vo pode passar de 1 KB com vários VOs.
    large_client_header_buffers 4 32k;

    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
}
